server {
    listen 80;
    server_name casego.ddns.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name casego.ddns.net;

    ssl_certificate /etc/letsencrypt/live/casego.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/casego.ddns.net/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — без этого nginx кэширует IP контейнеров навсегда
    # и после docker compose up -d --force-recreate ловит 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v1/auth/ {
        set $upstream_auth auth_fastapi;
        proxy_pass http://$upstream_auth:8000/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/users/ {
        set $upstream_auth auth_fastapi;
        proxy_pass http://$upstream_auth:8000/api/v1/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /profile/api/v1/ {
        set $upstream_profile app-service;
        proxy_pass http://$upstream_profile:8080/profile/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/case_profile/ {
        set $upstream_caseprofile case_profile;
        rewrite ^/api/v1/case_profile/(.*)$ /api/v1/case_go/$1 break;
        proxy_pass http://$upstream_caseprofile:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/case_go/ {
        set $upstream_casego case_go;
        proxy_pass http://$upstream_casego:8081/api/v1/case_go/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # index.html и service worker — всегда свежие, иначе PWA живёт
    # на старой версии пока вручную не сбросят кэш.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Ассеты с хешем в имени — можно кэшировать надолго.
    location ~* \.(js|css|wasm|woff2?|ttf|otf|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
}
