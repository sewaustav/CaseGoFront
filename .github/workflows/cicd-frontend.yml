name: CI/CD - Frontend (Flutter)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: tags
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/casego-frontend
          # монотонная метка: github.run_number сбрасывается при переименовании
          # workflow, из-за чего numerical ImagePolicy залипает на старом теге
          SEQ=$(date +%s)
          if [ "${{ github.ref_name }}" = "main" ]; then
            # prod: main-теги подхватывает Flux image automation в k8s
            echo "tags=$IMAGE:main-$SEQ-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # dev: :latest тянет docker compose на VPS
            echo "tags=$IMAGE:latest,$IMAGE:dev-$SEQ-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./case_go
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Frontend (dev VPS)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: maks
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/casego/frontend
            git fetch origin dev && git checkout -B dev origin/dev
            echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f case_go/docker-compose.yml pull frontend
            docker compose -f case_go/docker-compose.yml up -d frontend
